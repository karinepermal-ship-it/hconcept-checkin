<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b7f6c">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <title>HConcept Employee Check-In</title>
</head>

<body style="font-family:Arial;text-align:center;padding:60px 20px;">

  <img src="./icon-192.png"
       alt="HConcept"
       width="120"
       height="120">

  <h2>HConcept Employee Check-In</h2>

  <a id="checkinLink"
     href="https://script.google.com/macros/s/AKfycbzNmKN4zs5zdSUw38jSzKZSNJKJBEbggINZDnGcr_vtyK00IHcgWGEST-uF2pWQ44M3Ag/exec"
     style="display:inline-block;padding:18px 26px;background:#0b7f6c;color:white;text-decoration:none;border-radius:12px;font-weight:bold;font-size:20px;">
    OPEN CHECK-IN
  </a>

  <script>
    const params = new URLSearchParams(window.location.search);
    const employee = params.get('employee');

    const validEmployees = [
      'Akshay',
      'Bradon',
      'Fabien',
      'Kem',
      'Babooraj',
      'Karine'
    ];

    let checkinUrl =
      'https://script.google.com/macros/s/AKfycbzNmKN4zs5zdSUw38jSzKZSNJKJBEbggINZDnGcr_vtyK00IHcgWGEST-uF2pWQ44M3Ag/exec';

    if (employee && validEmployees.includes(employee)) {
      checkinUrl += '?employee=' + encodeURIComponent(employee);
      document.getElementById('checkinLink').href = checkinUrl;
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    const installedApp =
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    if (installedApp && employee && validEmployees.includes(employee)) {
      window.location.replace(checkinUrl);
    }
  </script>

</body>
</html>
